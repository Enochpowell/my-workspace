<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My workspace</title>
<link rel="stylesheet" href="/css/app.css">
<link rel="stylesheet" href="/css/auth.css">
</head>
<body>
<div class="app">
<div class="navwrap" id="navwrap">
<div class="rail" id="rail"></div>
<aside>
<div class="wshead"><button id="logobtn" aria-label="Change logo" title="Click to add or change the logo"><img id="bl" alt="Logo"><span id="bl-ph">＋</span></button><div class="wsname"><input id="wsname" data-brand="name" aria-label="Workspace name" maxlength="40"><input id="wstag" data-brand="tag" aria-label="Tagline" maxlength="80"></div></div>
<div class="scroll"><nav id="nav" aria-label="Pages"></nav><div id="chatside"></div></div>
<div class="sfoot"><button id="mechip" hidden aria-label="Your profile and settings"></button><p id="status" role="status" aria-live="polite"></p></div>
</aside>
</div>
<main id="main"></main>
</div>
<div id="fabs"></div>
<button id="menubtn" aria-label="Menu" aria-expanded="false" aria-controls="menu"><span></span></button>
<div id="scrim" hidden></div>
<div id="menu" role="dialog" aria-label="Menu" hidden></div>
<button id="sbtn" aria-label="Open the sidebar"><span class="bars">Menu</span><span id="sbname"></span></button>
<input type="file" id="logo-file2" hidden accept="image/png,image/jpeg,image/webp,image/svg+xml">
<div id="chat" role="dialog" aria-label="Chat" hidden></div>
<div id="sheet" aria-hidden="true"></div>
<div id="auth" hidden></div>
<script src="/js/runtime.js"></script>
<!-- Fonts load last on purpose, so a slow or blocked font service can never delay the app. The page falls back to system fonts. -->
</body>
</html>
